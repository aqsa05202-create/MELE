 if(!id){view.innerHTML='<p class="empty">Log in to see your profile.</p>';return}

 const own=user&&id===user.id,mine=posts.filter(p=>p.user_id===id),lk=mine.reduce((n,p)=>n+p.likes.length,0);
 const fers=follows.filter(f=>f.following_id===id).length,fing=follows.filter(f=>f.follower_id===id).length;
 const isF=user&&follows.some(f=>f.follower_id===user.id&&f.following_id===id);
 const handle='@'+(pr.username.toLowerCase().replace(/[^a-z0-9._]/g,'')||'user');
 const ava=pr.avatar_url?`<img class="av" src="${esc(pr.avatar_url)}" alt="${esc(pr.username)}">`:`<div class="av" style="background:${COLORS[(pr.color||0)%6]}">${esc(pr.username[0].toUpperCase())}</div>`;
 const list=ptab==='liked'?(own?posts.filter(p=>p.likes.some(l=>l.user_id===user.id)):[]):mine;
 const tile=p=>`<button class="tile" data-view="${p.id}" aria-label="Open post">${p.media_url?(p.media_type==='video'?`<video src="${esc(p.media_url)}#t=0.1" preload="metadata" muted playsinline${fs(p.filter)}></video>`:`<img src="${esc(p.media_url)}" alt="" loading="lazy"${fs(p.filter)}>`):art(p.theme)+`<span class="t">${esc(p.title||p.body)}</span>`}<span class="n">${p.media_type==='video'||p.kind!=='post'?'▷ ':'♥ '}${p.likes.length}</span></button>`;
 view.innerHTML=`<div class="ptop">${own?'<button data-edit aria-label="Edit profile">✏</button><button data-act="logout" aria-label="Log out" style="font-size:.95rem;font-weight:700">Log out</button>':'<button data-tab="feed" aria-label="Back">←</button><span></span>'}</div>
 <div class="phead"><div><h2>${esc(pr.username)}</h2><div class="handle">${esc(handle)}</div><div class="pst"><div><b>${fing}</b>Following</div><div><b>${fers}</b>Followers</div><div><b>${lk}</b>Likes</div></div></div><div class="bigav">${ava}</div></div>
 <p style="white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0 0">${esc(pr.bio||(own?'Tap ✏ to add a bio.':''))}</p>
 ${own?(editing?`<div class="card" style="padding:14px;margin-top:12px"><input id="pName" value="${esc(pr.username)}" maxlength="30" aria-label="Username" style="margin-bottom:8px"><textarea id="pBio" rows="2" maxlength="200" placeholder="Short bio (200 characters)" aria-label="Bio" style="margin-bottom:8px">${esc(pr.bio||'')}</textarea><label style="display:block;margin-bottom:8px;color:var(--mute);font-size:.9rem">Profile photo: <input id="pFile" type="file" accept="image/*"></label><button class="btn" id="pSave">Save profile</button></div>`:'<button class="pbtn" data-edit>Edit profile</button>'):`<button class="pbtn ${isF?'':'red'}" data-follow="${id}">${isF?'Following ✓':'Follow'}</button><button class="pbtn" data-msg="${id}" style="margin-top:8px">Message</button>`}
 <div class="ptabs"><button data-ptab="grid" class="${ptab==='grid'?'on':''}" aria-label="Posts">▦</button><button data-ptab="liked" class="${ptab==='liked'?'on':''}" aria-label="Liked">♡</button></div>
 ${list.length?`<div class="pgrid">${list.map(tile).join('')}</div>`:`<p class="empty">${ptab==='liked'&&!own?'🔒 Liked posts are private.':ptab==='liked'?'Posts you like will show here.':'No posts yet.'}</p>`}`}
const INFO={about:['About Mela','Mela is a friendly place to share posts, reels and videos with your community.'],privacy:['Privacy','We store your email, username, profile and the content you share. Posts, reels, videos and profiles are public. You can delete your own posts any time.'],terms:['Terms','Be kind and respectful. Do not post illegal, harmful or hateful content. Content that breaks these rules may be removed.']};
function render(){topbar();document.body.classList.toggle('tt',tab==='reels');document.querySelectorAll('#bnav [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));updBadge();updNbadge();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));({feed:renderFeed,reels:renderReels,videos:renderVideos,profile:renderProfile,inbox:renderInbox,notifs:renderNotifs})[tab]()}
function needLogin(){if(user)return false;openAuth(false);toast('Log in first');return true}
function openAuth(s){signup=s;$('#authTitle').textContent=s?'Create account':'Log in';$('#aName').hidden=!s;$('#aGo').textContent=s?'Sign up':'Log in';$('#aSwitch').textContent=s?'I have an account':'Create an account';$('#authDlg').showModal()}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;watching=null;pid=null;thread=null;render();scrollTo(0,0)}
 else if(d.prof){pid=d.prof;tab='profile';render();scrollTo(0,0)}
 else if(d.auth)openAuth(d.auth==='signup')
 else if(d.rtab){rtab=d.rtab;render()}
 else if(d.story!==undefined)openStory(+d.story)
 else if('storyAdd' in d){if(needLogin())return;openCreate('story')}
 else if('sprev' in d)prevStory()
 else if('snext' in d)nextStory()
 else if('sclose' in d)closeStory()
 else if('sdel' in d){const it=sgroups[sv.gi]?.items[sv.si];if(it&&confirm('Delete this story?')){await sb.from('stories').delete().eq('id',it.id);stories=stories.filter(x=>x.id!==it.id);closeStory();load()}}
 else if(d.cr==='close')closeCreate()
 else if(d.cr==='back'){cf=null;ctext=false;if(curl)URL.revokeObjectURL(curl);curl=null;crRender()}
 else if(d.cr==='text'){ctext=true;ck='post';crRender()}
 else if(d.cr==='post')crPost()
 else if(d.ck){ck=d.ck;crRender()}
 else if(d.fil!==undefined){cfil=d.fil;crRender()}
 else if(d.ptab){ptab=d.ptab;render()}
 else if(d.msg){if(needLogin())return;thread=d.msg;tab='inbox';pid=null;render();scrollTo(0,0)}
 else if(d.thread){thread=d.thread;render()}
 else if(d.notif){const n=notifs.find(x=>x.id===d.notif);if(n&&n.post_id&&posts.some(x=>x.id===n.post_id))openView(n.post_id);else if(n){pid=n.actor_id;tab='profile';render();scrollTo(0,0)}}
 else if('threadBack' in d){thread=null;render()}
 else if('edit' in d){editing=!editing;render()}
 else if(d.view)openView(d.view)
 else if(d.act==='logout'){await sb.auth.signOut()}
 else if(d.act==='create'){if(!needLogin())openCreate()}
 else if(d.cmsheet)openSheet(d.cmsheet)
 else if(d.sharesheet)openShare()
 else if(d.copy){try{navigator.clipboard.writeText(location.href.split('#')[0])}catch(x){}toast('Link copied');$('#shDlg').close()}
 else if(d.info){$('#infoT').textContent=INFO[d.info][0];$('#infoB').textContent=INFO[d.info][1];$('#infoDlg').showModal()}
 else if(d.follow){if(needLogin())return;const fid=d.follow,on=follows.some(f=>f.follower_id===user.id&&f.following_id===fid);
  if(on){follows=follows.filter(f=>!(f.follower_id===user.id&&f.following_id===fid));render();await sb.from('follows').delete().match({follower_id:user.id,following_id:fid})}
  else{follows.push({follower_id:user.id,following_id:fid});render();await sb.from('follows').insert({follower_id:user.id,following_id:fid})}}
 else if(d.like){if(needLogin())return;const p=posts.find(x=>x.id===d.like),on=p.likes.some(l=>l.user_id===user.id);
  if(on){p.likes=p.likes.filter(l=>l.user_id!==user.id);render();await sb.from('likes').delete().match({post_id:p.id,user_id:user.id})}
  else{p.likes.push({user_id:user.id});render();await sb.from('likes').insert({post_id:p.id,user_id:user.id})}}
 else if('cm' in d){const c=t.closest('article').querySelector('.cmts');c.hidden=!c.hidden}
 else if(d.share){try{navigator.clipboard.writeText(location.href.split('#')[0])}catch(x){}toast('Link copied')}
 else if(d.open){watching=d.open;render();scrollTo(0,0)}
 else if('back' in d){watching=null;render()}
 else if(d.del){if(confirm('Delete this post?')){await sb.from('posts').delete().eq('id',d.del);$('#pvDlg').close();load()}}
 else if(t.id==='login')openAuth(false);else if(t.id==='signupBtn')openAuth(true);
 else if(t.id==='logout'){await sb.auth.signOut()}
 else if(t.id==='create'){openCreate()}
 else if(t.id==='aGoogle'){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)toast(r.error.message)}
 else if(t.id==='pSave'){const name=$('#pName').value.trim(),bio=$('#pBio').value.trim(),f=$('#pFile').files[0];
  if(name.length<2){toast('Name is too short');return}if(f&&f.size>5242880){toast('Photo must be under 5 MB');return}
  t.disabled=true;t.textContent='Saving…';const upd={username:name,bio:bio||null};
  if(f){const path=`${user.id}/avatar-${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
   if(up.error){toast(up.error.message);t.disabled=false;t.textContent='Save profile';return}upd.avatar_url=sb.storage.from('media').getPublicUrl(path).data.publicUrl}
  const {error}=await sb.from('profiles').update(upd).eq('id',user.id);t.disabled=false;t.textContent='Save profile';
  if(error){toast(error.message);return}Object.assign(me,upd);editing=false;await load();toast('Profile saved')}
 else if(t.id==='aSwitch')openAuth(!signup);else if(t.id==='aCancel')$('#authDlg').close();
 else if(t.id==='nCancel')$('#newDlg').close();
 else if(t.id==='aGo'){
  const email=$('#aEmail').value.trim(),password=$('#aPass').value,username=$('#aName').value.trim();
  if(!email||password.length<6||(signup&&username.length<2)){toast('Fill every field (password 6+ characters)');return}
  t.disabled=true;
  const r=signup?await sb.auth.signUp({email,password,options:{data:{username}}}):await sb.auth.signInWithPassword({email,password});
  t.disabled=false;
  if(r.error){toast(r.error.message);return}
  $('#authDlg').close();
  if(signup&&!r.data.session)toast('Check your email to confirm your account');
 }
 else if(t.id==='nGo'){
  const body=$('#nBody').value.trim();if(!body){toast('Write something first');return}
  const kind=$('#nKind').value,title=$('#nTitle').value.trim()||null;
  const f=$('#nFile').files[0];let media_url=null,media_type=null;
  if(f&&f.size>52428800){toast('File is over 50 MB');return}
  t.disabled=true;t.textContent='Publishing…';
  if(f){const path=`${user.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
   const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
   if(up.error){toast(up.error.message);t.disabled=false;t.textContent='Publish';return}
   media_url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;media_type=f.type.startsWith('video')?'video':'image'}
  const {error}=await sb.from('posts').insert({user_id:user.id,kind,title,body,media_url,media_type,theme:Math.floor(Math.random()*6)});
  t.disabled=false;t.textContent='Publish';if(error){toast(error.message);return}
  $('#nFile').value='';$('#nBody').value='';$('#nTitle').value='';$('#newDlg').close();tab=kind==='post'?'feed':kind==='reel'?'reels':'videos';watching=null;await load();toast('Published');
 }
});
document.addEventListener('submit',async e=>{
 const id=e.target.dataset.form;if(!id)return;e.preventDefault();if(needLogin())return;
 const i=e.target.querySelector('input'),body=i.value.trim();if(!body)return;
 const {error}=await sb.from('comments').insert({post_id:id,user_id:user.id,body});
 if(error){toast(error.message);return}
 i.value='';await load();if($('#cmDlg').open)openSheet(id);const a=[...document.querySelectorAll('[data-form]')].find(f=>f.dataset.form===id);if(a)a.closest('.cmts').hidden=false;
});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderFeed();const i=$('#search');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const r=e.target.closest('[data-reel]');if(!r||e.target.closest('button'))return;const v=r.querySelector('video');if(!v)return;if(v.muted)v.muted=false;else v.paused?v.play():v.pause()});
async function setUser(session){
 user=session?.user||null;me=null;msgs=[];notifs=[];thread=null;if(chan){sb.removeChannel(chan);chan=null}
 if(user){const {data}=await sb.from('profiles').select('id,username,color,avatar_url,bio').eq('id',user.id).single();me=data;await loadMsgs();await loadNotifs();subscribe()}
 await load();
}
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>setUser(s),0)});
sb.auth.getSession().then(({data})=>setUser(data.session));
setInterval(()=>{if(!document.hidden&&$('#sv').hidden&&$('#cr').hidden&&!document.querySelector('dialog[open]')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))load()},20000);
</script>
</body>
